
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login & Registration</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#172b45;display:grid;place-items:center;min-height:100vh}
.box{background:white;padding:25px;border-radius:12px;width:300px;text-align:center}
input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#1769aa;color:white;border:0;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h2 id="heading">Registration</h2>
<input id="phone" placeholder="+8801XXXXXXXXX">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script>
const db = supabase.createClient(
 "YOUR_SUPABASE_URL",
 "YOUR_SUPABASE_ANON_KEY"
);

async function register(){
 const phone=document.getElementById("phone").value;
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signUp({
  phone,password
 });
 document.getElementById("msg").innerText =
  error ? error.message : "Account created!";
}

async function login(){
 const phone=document.getElementById("phone").value;
 const password=document.getElementById("password").value;
 const {data,error}=await db.auth.signInWithPassword({
  phone,password
 });
 document.getElementById("msg").innerText =
  error ? error.message : "Login successful!";
}
</script>
</body>
</html>                                                                                         </html>llo
